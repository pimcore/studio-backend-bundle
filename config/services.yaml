services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    #
    # INSTALLER
    #
    Pimcore\Bundle\StudioBackendBundle\Installer:
        public: true
        arguments:
            $bundle: "@=service('kernel').getBundle('PimcoreStudioBackendBundle')"

    Pimcore\Bundle\StudioBackendBundle\Cache\Service\CacheClearerServiceInterface:
        class: Pimcore\Bundle\StudioBackendBundle\Cache\Service\CacheClearerService

    Pimcore\Bundle\StudioBackendBundle\Util\Config\ConfigKeyMapperInterface:
        class: Pimcore\Bundle\StudioBackendBundle\Util\Config\ConfigKeyMapper

    # Decorates the core user checker to deny Studio API authentication for accounts that
    # require two-factor authentication, which this firewall does not yet challenge for.
    Pimcore\Bundle\StudioBackendBundle\Security\User\TwoFactorEnforcingUserChecker: ~







