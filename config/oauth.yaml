services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    #
    # Embedded OAuth 2.1 authorization-server module.
    #
    # Self-contained and isolated: this file registers only the module's own
    # services and must not wire anything into Symfony's global security config
    # (providers / firewall map). The resource-server authenticator is added to
    # the existing pimcore_mcp firewall chain later, gated on the
    # `pimcore_studio_backend.oauth.enabled` parameter.
    #

    # Resource registry; $resources is populated from bundle config in the extension.
    Pimcore\Bundle\StudioBackendBundle\OAuth\Contract\ResourceRegistryInterface:
        class: Pimcore\Bundle\StudioBackendBundle\OAuth\Registry\ConfigProtectedResourceRegistry
        arguments:
            $resources: []

    # Embedded identity resolution (subject = Pimcore user id).
    Pimcore\Bundle\StudioBackendBundle\OAuth\Contract\IdentityResolverInterface:
        class: Pimcore\Bundle\StudioBackendBundle\OAuth\Identity\EmbeddedIdentityResolver

    # Token record store (revocation / reuse detection) and the store-backed
    # resource-server revocation check.
    Pimcore\Bundle\StudioBackendBundle\OAuth\Server\Repository\TokenRecordStoreInterface:
        class: Pimcore\Bundle\StudioBackendBundle\OAuth\Server\Repository\TokenRecordStore

    Pimcore\Bundle\StudioBackendBundle\OAuth\Contract\TokenRevocationCheckerInterface:
        class: Pimcore\Bundle\StudioBackendBundle\OAuth\Token\StoredTokenRevocationChecker

    # Resource-server JWT validator. $publicKey and $issuer come from bundle config
    # (set in the extension).
    Pimcore\Bundle\StudioBackendBundle\OAuth\Contract\TokenValidatorInterface:
        class: Pimcore\Bundle\StudioBackendBundle\OAuth\Token\EmbeddedTokenValidator
        arguments:
            $publicKey: null
            $issuer: null

    # Resource-server authenticator added to the pimcore_mcp firewall chain.
    # $enabled is set from config in the extension.
    Pimcore\Bundle\StudioBackendBundle\Security\Authenticator\Mcp\OAuthAccessTokenAuthenticator:
        arguments:
            $enabled: false

    # Entry point for the pimcore_mcp firewall (401 + RFC 9728 challenge).
    # $oauthEnabled is set from config in the extension.
    Pimcore\Bundle\StudioBackendBundle\Security\EntryPoint\McpAuthenticationEntryPoint:
        arguments:
            $oauthEnabled: false

    # RFC 9728 discovery endpoint controller (routed in config/pimcore/routing.yaml).
    Pimcore\Bundle\StudioBackendBundle\OAuth\Controller\ProtectedResourceMetadataController:
        public: true
        tags: ['controller.service_arguments']

    #
    # Authorization server (token issuance). Standalone league instance built by
    # the factory; repositories and keys come from bundle config (set in the
    # extension). Endpoints are routed in config/pimcore/routing.yaml.
    #
    Pimcore\Bundle\StudioBackendBundle\OAuth\Server\Repository\ClientRepository:
        arguments:
            $clients: []

    Pimcore\Bundle\StudioBackendBundle\OAuth\Server\Repository\ScopeRepository: ~

    Pimcore\Bundle\StudioBackendBundle\OAuth\Server\Repository\AccessTokenRepository:
        arguments:
            $issuer: null

    Pimcore\Bundle\StudioBackendBundle\OAuth\Server\AuthorizationServerFactory:
        arguments:
            $privateKey: null
            $passphrase: null
            $encryptionKey: null
            $accessTokenTtl: 3600

    Pimcore\Bundle\StudioBackendBundle\OAuth\Controller\TokenController:
        public: true
        tags: ['controller.service_arguments']

    Pimcore\Bundle\StudioBackendBundle\OAuth\Controller\AuthorizationServerMetadataController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $issuer: null
