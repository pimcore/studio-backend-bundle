services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # controllers are imported separately to make sure they're public
  # and have a tag that allows actions to type-hint services
  Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Controller\:
    resource: '../src/Bundle/Seo/Controller'
    public: true
    tags: [ 'controller.service_arguments' ]

  #
  # Services
  #

  Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Service\RedirectsServiceInterface:
    class: Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Service\RedirectsService

  #
  # Hydrators
  #

  Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Hydrator\RedirectHydratorInterface:
    class: Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Hydrator\RedirectHydrator

  #
  # Repository
  #

  Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Repository\RedirectsRepositoryInterface:
    class: Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Repository\RedirectsRepository

  #
  # Filters
  #

  Pimcore\Bundle\StudioBackendBundle\Bundle\Seo\Filter\UrlFilter:
    tags: [ 'pimcore.studio_backend.listing.filter' ]