  Pimcore\Bundle\StudioBackendBundle\Class\Service\ObjectBrick\ObjectBrickServiceInterface:
    class: Pimcore\Bundle\StudioBackendBundle\Class\Service\ObjectBrick\ObjectBrickService

  Pimcore\Bundle\StudioBackendBundle\Class\Service\ObjectBrick\ObjectBrickTreeServiceInterface:
    class: Pimcore\Bundle\StudioBackendBundle\Class\Service\ObjectBrick\ObjectBrickTreeService

