services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # PSR-17 Factory (implements ResponseFactoryInterface + StreamFactoryInterface)
    pimcore_studio_backend.mcp.psr17_factory:
        class: Http\Discovery\Psr17Factory
        autowire: false
        autoconfigure: false

    Psr\Http\Message\ResponseFactoryInterface:
        alias: pimcore_studio_backend.mcp.psr17_factory

    Psr\Http\Message\StreamFactoryInterface:
        alias: pimcore_studio_backend.mcp.psr17_factory

    # PSR-7 / Symfony HTTP bridge factories
    Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory:
        autoconfigure: false

    Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory:
        autoconfigure: false

    Symfony\Bridge\PsrHttpMessage\HttpMessageFactoryInterface:
        alias: Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory

    Symfony\Bridge\PsrHttpMessage\HttpFoundationFactoryInterface:
        alias: Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory

    # Declares the MCP endpoints as an OAuth protected resource. $enabled and $issuer come
    # from pimcore_studio_backend.oauth in the extension: MCP consumes the authorization
    # server's configuration, which is why this lives here rather than in oauth.yaml.
    Pimcore\Bundle\StudioBackendBundle\Mcp\ProtectedResourceProvider:
        tags: ['pimcore_studio_backend.oauth.protected_resource_provider']
        arguments:
            $enabled: false
            $issuer: null

    # --- Shared MCP tool boundary ---
    # Terminal-catch error handling for MCP tools, in this bundle so that every bundle exposing MCP
    # tools shares one policy about what may leave the Pimcore boundary. The handler forwards no
    # exception message except InvalidMcpToolArgumentException; a tool that can say something useful
    # about a failure type-catches it and composes that sentence itself.
    Pimcore\Bundle\StudioBackendBundle\Mcp\Tool\McpToolErrorHandler: ~
    Pimcore\Bundle\StudioBackendBundle\Mcp\Tool\McpToolErrorHandlerInterface:
        alias: Pimcore\Bundle\StudioBackendBundle\Mcp\Tool\McpToolErrorHandler
