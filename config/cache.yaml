services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    Pimcore\Bundle\StudioBackendBundle\Cache\Controller\:
        resource: '../src/Cache/Controller'
        public: true
        tags: [ 'controller.service_arguments' ]

    #
    # Services
    #
    Pimcore\Bundle\StudioBackendBundle\Cache\Service\CacheServiceInterface:
        class: Pimcore\Bundle\StudioBackendBundle\Cache\Service\CacheService
