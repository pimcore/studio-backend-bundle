framework:
  rate_limiter:
    studio_api_general:
      policy: 'sliding_window'
      limit: 500
      interval: '1 minute'
    reset_password:
      policy: 'fixed_window'
      limit: 5
      interval: '5 minutes'
    setting_admin_thumbnail:
      policy: 'fixed_window'
      limit: 60
      interval: '1 minutes'
    # Failed MCP authentication attempts, keyed on client IP. Only a request whose bearer
    # credential resolved to no user ever reaches this limiter - see McpLoginRateLimiter -
    # so a successful authentication cannot be blocked by it.
    studio_mcp_login:
      policy: 'fixed_window'
      limit: 5
      interval: '5 minutes'
    # Request volume on /pimcore-mcp/, kept separate from studio_api_general because it is
    # sized for machine clients rather than the Studio UI: a single agent server can serve
    # every chat in the installation from one address, so this is a denial-of-service
    # ceiling, not a per-user quota.
    studio_mcp_general:
      policy: 'sliding_window'
      limit: 3000
      interval: '1 minute'
    # Dynamic client registrations on /pimcore-oauth/register, keyed on client IP. Sized
    # as a denial-of-service ceiling rather than a quota, for the same reason as
    # studio_mcp_general: a hosted AI connector registers from its provider's egress
    # range, shared by every customer of that provider, so this bucket is not one
    # organisation's. Registration is idempotent (ClientRegistrar::register), so repeat
    # registrations of the same client create no rows and legitimate traffic stays far
    # below this.
    studio_oauth_register:
      policy: 'fixed_window'
      limit: 60
      interval: '1 hour'
