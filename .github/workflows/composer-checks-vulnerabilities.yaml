name: "Composer vulnerabilities check"

on:
    workflow_dispatch:
    schedule:
        - cron:  '0 7 * * *'

permissions:
  contents: read

jobs:
    composer-checks:
        uses: pimcore/workflows-collection-public/.github/workflows/reusable-composer-vulnerabilities.yaml@main
        if: github.repository_owner == 'pimcore'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { php-version: 8.5, branch: 2026.x }
                    - { php-version: 8.4, branch: 2026.x }
                    - { php-version: 8.5, branch: 2026.3 }
                    - { php-version: 8.4, branch: 2026.3 }
                    - { php-version: 8.4, branch: 2025.4 }
                    - { php-version: 8.3, branch: 2025.4 }
        with:
            php-version: ${{ matrix.php-version }}
            branch: ${{ matrix.branch }}
            ignore-list: "public"
            private-repo: ${{ github.event.repository.private }}
        secrets: inherit
