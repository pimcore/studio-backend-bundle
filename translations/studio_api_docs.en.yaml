custom_report_export_csv_description: |
  Creating the CSV export file for custom reports. <br> Parameters are: 
  <ul>
    <li><strong>name (required)</strong>: Name of custom report</li>
    <li><strong>filters</strong>: Array of filters to filter the data</li>
      <ul>
        <li><strong>columnFilters</strong>: Allow filtering based on the columns and their values</li>
        <li><strong>drillDownFilters</strong>: Filter based on pre-defined drill down filters</li>
      </ul>
    <li><strong>sortBy</strong>: Column name to sort the data by</li>
    <li><strong>sortOrder</strong>: Sort order (ASC/DESC)</li>
    <li><strong>page</strong>: Offset, can be used in combination with pageSize</li>
    <li><strong>pageSize</strong>: Limit returned data</li>
    <li><strong>includeHeaders</strong>: Include headers in the export</li>
    <li><strong>delimiter</strong>: Delimiter can be set to anything, but the default is a <strong>semicolon</strong>/li>
  </ul>
  Download has to be triggered separately via the csv download route with the <strong>{jobRunId}</strong> returned in the response
