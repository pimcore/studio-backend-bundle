custom_reports_chart_description: |
  Get paginated chart data for a specific report by name. <br> Parameters are: 
  <ul>
    <li><strong>name (required)</strong>: Name of existing custom report</li>
    <li><strong>filters</strong>: Array of filters to filter the data</li>
      <ul>
        <li><strong>columnFilters</strong>: Allow filtering based on the columns and their values</li>
        <li><strong>drillDownFilters</strong>: Filter based on pre-defined drill down filters</li>
      </ul>
    <li><strong>sortBy</strong>: Column name to sort the data by</li>
    <li><strong>sortOrder</strong>: Sort order (ASC/DESC)</li>
    <li><strong>page</strong>: Offset, can be used in combination with pageSize</li>
    <li><strong>pageSize</strong>: Limit returned data</li>
    <li><strong>fields</strong>: Array of fields to be included in the data. If not provided, all fields will be included</li>
  </ul>
custom_reports_chart_summary: Get chart data for a specific report
custom_reports_chart_name_parameter: Name of the report
custom_reports_chart_success_response: Chart data as JSON. The actual data depends on the selected adapter in the report configuration.
custom_reports_chart_sort_by_parameter: Sort by column parameter
