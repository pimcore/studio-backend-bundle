bundle_application_logger_get_collection_description: |
  Get all paginated log entries. <br> 
  You can specify different filters in your request body. Available filters are: <br>
  <ul>
    <li>
      <strong>like and equals</strong>: Filter by key and value. Allowed keys:
      <ul>
        <li><strong>priority</strong></li>
        <li><strong>component</strong></li>
        <li><strong>relatedobject</strong></li>
        <li><strong>message</strong></li>
        <li><strong>pid</strong></li>
      </ul>
    </li>
    <li><strong>dateFrom and dateTo</strong>: Filter by date (from, to)</li>
    <li><strong>page</strong>: Used for offset calculation in pagination. To be used, needs to be defined together with the pageSize</li>
    <li><strong>pageSize</strong>: Used for limiting the result numbers per page. To be used, needs to be defined together with the page</li>
  </ul>
bundle_application_logger_get_collection_success_response: Paginated log entries with total count as header param as JSON
bundle_application_logger_get_collection_summary: Get all log entries
