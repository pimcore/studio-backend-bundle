bundle_seo_redirects_get_collection_description: |
  Get all paginated redirects entries. <br> You can specify different filters in your request body. Example filters are: <br>
  <ul>
    <li><strong>page</strong>: Used for offset calculation in pagination. To be used, needs to be defined together with the page.size</li>
    <li><strong>pageSize</strong>: Used for limiting the result numbers per page. To be used, needs to be defined together with the page</li>
    <li><strong>url</strong>: Filter by redirect source URL</li>
    <li><strong>type</strong>: Filter by redirect type (entire_uri, path_query, path, auto_create)</li>
    <li><strong>date</strong>: Filter for example by expiry (on, from, to)</li>
  </ul>
